name: Feature request
description: Propose a new component, prop, token, or docs improvement.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please search
        [existing issues](https://github.com/wwestrada1217/spruce-ui-react/issues)
        first to avoid duplicates.
  - type: dropdown
    id: kind
    attributes:
      label: Kind of request
      options:
        - New component
        - New prop / variant on an existing component
        - Design tokens / theming
        - Icons
        - Accessibility improvement
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to build, and what's missing or awkward today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        What would you like to see? For API proposals, a usage sketch helps:
      placeholder: |
        <Rating value={3} max={5} onChange={(v) => ...} readOnly />
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you're using now, or other designs you considered.
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Links, screenshots, or prior art from other design systems.
